<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo — Daniele Dallavecchia · Árvore Hermética</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#050210;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 20px;
  font-family:'Raleway',sans-serif;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(80,20,160,.18) 0%, transparent 55%),
    radial-gradient(ellipse at 70% 60%, rgba(160,110,20,.1) 0%, transparent 50%);
  pointer-events:none;
}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:24px;max-width:480px;width:100%}
.logo-box{
  width:100%;aspect-ratio:1;
  background:radial-gradient(ellipse at 40% 40%, #1c0a3a 0%, #080412 100%);
  border-radius:16px;
  border:1px solid rgba(201,168,76,.25);
  box-shadow:0 0 80px rgba(90,20,160,.2), 0 0 40px rgba(201,168,76,.05);
  overflow:hidden;
}
.title{
  font-family:'Cinzel',serif;
  font-size:clamp(16px,3vw,24px);
  letter-spacing:4px;text-transform:uppercase;
  background:linear-gradient(135deg,#c9a84c,#f0d080,#c9a84c);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-align:center;
}
.sub{
  font-size:11px;letter-spacing:3px;color:rgba(200,180,240,.45);
  text-transform:uppercase;text-align:center;
}
.gold-line{width:60px;height:1px;background:linear-gradient(90deg,transparent,#c9a84c,transparent)}
.legend{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:400px;
}
.leg-item{
  font-size:11px;color:rgba(200,180,240,.6);
  padding:4px 12px;border:1px solid rgba(201,168,76,.2);
  border-radius:99px;letter-spacing:.5px;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes spin-slow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spin-rev{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@keyframes shimmer{0%,100%{opacity:.3}50%{opacity:.8}}
</style>
</head>
<body>
<div class="wrap">
  <div class="gold-line"></div>
  <div class="title">Daniele Dallavecchia</div>
  <div class="sub">Psicanálise &amp; Psicoterapia</div>
  <div class="gold-line"></div>

  <div class="logo-box">
<svg id="svgTree" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
          <defs>
            <radialGradient id="bg1" cx="50%" cy="45%" r="55%">
              <stop offset="0%" stop-color="#2d0a5a" stop-opacity=".9"/>
              <stop offset="100%" stop-color="#080412" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="gd" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#b8922c"/>
              <stop offset="40%" stop-color="#f5e090"/>
              <stop offset="100%" stop-color="#c9a84c"/>
            </linearGradient>
            <linearGradient id="sv" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#a098c8"/>
              <stop offset="100%" stop-color="#e8e0ff"/>
            </linearGradient>
            <linearGradient id="pu" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6020b0"/>
              <stop offset="100%" stop-color="#9040e0"/>
            </linearGradient>
            <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="glow2"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>

          <!-- BG -->
          <rect width="400" height="400" fill="#080412"/>
          <circle cx="200" cy="190" r="170" fill="url(#bg1)"/>

          <!-- Outer ring + tick marks (Hermetic wheel) -->
          <circle cx="200" cy="190" r="155" fill="none" stroke="url(#gd)" stroke-width=".7" opacity=".35"
            style="animation:spin-slow 90s linear infinite;transform-origin:200px 190px"/>
          <!-- 12 tick marks -->
          <g style="animation:spin-slow 90s linear infinite;transform-origin:200px 190px" opacity=".4">
            <line x1="200" y1="35" x2="200" y2="46" stroke="#c9a84c" stroke-width="1.2"/>
            <line x1="200" y1="35" x2="200" y2="46" stroke="#c9a84c" stroke-width="1.2" transform="rotate(30 200 190)"/>
            <line x1="200" y1="35" x2="200" y2="46" stroke="#c9a84c" stroke-width="1.2" transform="rotate(60 200 190)"/>
            <line x1="200" y1="35" x2="200" y2="46" stroke="#c9a84c" stroke-width="1.2" transform="rotate(90 200 190)"/>
            <line x1="200" y1="35" x2="200" y2="46" stroke="#c9a84c" stroke-width="1.2" transform="rotate(120 200 190)"/>
            <line x1="200" y1="35" x2="200" y2="46" stroke="#c9a84c" stroke-width="1.2" transform="rotate(150 200 190)"/>
            <line x1="200" y1="35" x2="200" y2="46" stroke="#c9a84c" stroke-width="1.2" transform="rotate(180 200 190)"/>
            <line x1="200" y1="35" x2="200" y2="46" stroke="#c9a84c" stroke-width="1.2" transform="rotate(210 200 190)"/>
            <line x1="200" y1="35" x2="200" y2="46" stroke="#c9a84c" stroke-width="1.2" transform="rotate(240 200 190)"/>
            <line x1="200" y1="35" x2="200" y2="46" stroke="#c9a84c" stroke-width="1.2" transform="rotate(270 200 190)"/>
            <line x1="200" y1="35" x2="200" y2="46" stroke="#c9a84c" stroke-width="1.2" transform="rotate(300 200 190)"/>
            <line x1="200" y1="35" x2="200" y2="46" stroke="#c9a84c" stroke-width="1.2" transform="rotate(330 200 190)"/>
          </g>

          <!-- Inner sacred circle -->
          <circle cx="200" cy="190" r="128" fill="none" stroke="url(#sv)" stroke-width=".5" opacity=".2"
            style="animation:spin-rev 70s linear infinite;transform-origin:200px 190px"/>

          <!-- Vesica Piscis (two overlapping circles — As above so below) -->
          <ellipse cx="200" cy="165" rx="38" ry="58" fill="none" stroke="url(#gd)" stroke-width=".8" opacity=".3"/>
          <ellipse cx="200" cy="215" rx="38" ry="58" fill="none" stroke="url(#gd)" stroke-width=".8" opacity=".3"/>

          <!-- CADUCEUS / Serpents on the trunk -->
          <!-- Left serpent -->
          <path d="M196 260 C185 240, 192 220, 197 205 C202 190, 188 175, 196 160 C204 145, 190 130, 197 115 C203 100, 196 90, 197 80"
            fill="none" stroke="url(#sv)" stroke-width="1.4" stroke-linecap="round" opacity=".65"
            style="animation:shimmer 5s ease-in-out infinite"/>
          <!-- Right serpent -->
          <path d="M204 260 C215 240, 208 220, 203 205 C198 190, 212 175, 204 160 C196 145, 210 130, 203 115 C197 100, 204 90, 203 80"
            fill="none" stroke="url(#gd)" stroke-width="1.4" stroke-linecap="round" opacity=".65"
            style="animation:shimmer 5s ease-in-out infinite 2.5s"/>

          <!-- Main TRUNK -->
          <line x1="200" y1="268" x2="200" y2="72" stroke="url(#gd)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

          <!-- BRANCHES — natural asymmetric organic tree -->
          <g style="animation:float 7s ease-in-out infinite;transform-origin:200px 190px" filter="url(#glow)">
            <!-- Layer 1 — lowest branches -->
            <path d="M200 235 Q162 215 132 206" stroke="url(#sv)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            <path d="M200 235 Q238 215 268 206" stroke="url(#sv)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            <!-- Layer 2 -->
            <path d="M200 210 Q170 188 148 175" stroke="url(#gd)" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M200 210 Q230 188 252 175" stroke="url(#gd)" stroke-width="2" fill="none" stroke-linecap="round"/>
            <!-- Layer 3 -->
            <path d="M200 185 Q174 164 155 150" stroke="url(#sv)" stroke-width="1.7" fill="none" stroke-linecap="round"/>
            <path d="M200 185 Q226 164 245 150" stroke="url(#sv)" stroke-width="1.7" fill="none" stroke-linecap="round"/>
            <!-- Layer 4 — fine upper branches -->
            <path d="M200 160 Q180 138 164 123" stroke="url(#gd)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
            <path d="M200 160 Q220 138 236 123" stroke="url(#gd)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
            <!-- Layer 5 — finest -->
            <path d="M200 138 Q188 118 182 100" stroke="url(#sv)" stroke-width="1" fill="none" stroke-linecap="round"/>
            <path d="M200 138 Q212 118 218 100" stroke="url(#sv)" stroke-width="1" fill="none" stroke-linecap="round"/>
            <!-- Sub-branches L1 -->
            <path d="M132 206 Q114 198 100 192" stroke="url(#gd)" stroke-width="1.1" fill="none" opacity=".7"/>
            <path d="M132 206 Q120 194 118 180" stroke="url(#gd)" stroke-width="1" fill="none" opacity=".6"/>
            <path d="M268 206 Q286 198 300 192" stroke="url(#gd)" stroke-width="1.1" fill="none" opacity=".7"/>
            <path d="M268 206 Q280 194 282 180" stroke="url(#gd)" stroke-width="1" fill="none" opacity=".6"/>
            <!-- Sub-branches L2 -->
            <path d="M148 175 Q132 164 122 154" stroke="url(#sv)" stroke-width="1" fill="none" opacity=".65"/>
            <path d="M252 175 Q268 164 278 154" stroke="url(#sv)" stroke-width="1" fill="none" opacity=".65"/>
            <!-- Sub-branches L3 -->
            <path d="M155 150 Q140 138 132 124" stroke="url(#gd)" stroke-width=".9" fill="none" opacity=".6"/>
            <path d="M155 150 Q148 135 152 120" stroke="url(#gd)" stroke-width=".8" fill="none" opacity=".5"/>
            <path d="M245 150 Q260 138 268 124" stroke="url(#gd)" stroke-width=".9" fill="none" opacity=".6"/>
            <path d="M245 150 Q252 135 248 120" stroke="url(#gd)" stroke-width=".8" fill="none" opacity=".5"/>
            <!-- Sub-branches L4 -->
            <path d="M164 123 Q154 112 150 98" stroke="url(#sv)" stroke-width=".8" fill="none" opacity=".55"/>
            <path d="M164 123 Q158 108 166 95" stroke="url(#sv)" stroke-width=".7" fill="none" opacity=".5"/>
            <path d="M236 123 Q246 112 250 98" stroke="url(#sv)" stroke-width=".8" fill="none" opacity=".55"/>
            <path d="M236 123 Q242 108 234 95" stroke="url(#sv)" stroke-width=".7" fill="none" opacity=".5"/>

            <!-- Leaves — small glowing orbs at tips -->
            <circle cx="100" cy="192" r="4.5" fill="url(#pu)" opacity=".9"/>
            <circle cx="118" cy="180" r="3.8" fill="url(#gd)" opacity=".85"/>
            <circle cx="300" cy="192" r="4.5" fill="url(#pu)" opacity=".9"/>
            <circle cx="282" cy="180" r="3.8" fill="url(#gd)" opacity=".85"/>
            <circle cx="122" cy="154" r="3.5" fill="url(#sv)" opacity=".8"/>
            <circle cx="278" cy="154" r="3.5" fill="url(#sv)" opacity=".8"/>
            <circle cx="132" cy="124" r="3.2" fill="url(#gd)" opacity=".8"/>
            <circle cx="152" cy="120" r="3" fill="url(#pu)" opacity=".75"/>
            <circle cx="268" cy="124" r="3.2" fill="url(#gd)" opacity=".8"/>
            <circle cx="248" cy="120" r="3" fill="url(#pu)" opacity=".75"/>
            <circle cx="150" cy="98" r="3" fill="url(#sv)" opacity=".8"/>
            <circle cx="166" cy="95" r="2.8" fill="url(#gd)" opacity=".75"/>
            <circle cx="250" cy="98" r="3" fill="url(#sv)" opacity=".8"/>
            <circle cx="234" cy="95" r="2.8" fill="url(#gd)" opacity=".75"/>
            <circle cx="182" cy="100" r="3.5" fill="url(#pu)" opacity=".85"/>
            <circle cx="218" cy="100" r="3.5" fill="url(#pu)" opacity=".85"/>
            <circle cx="200" cy="72" r="5" fill="url(#gd)" style="animation:pulse 3s ease-in-out infinite"/>
          </g>

          <!-- HERMETIC SYMBOLS — placed at key branch junctions -->
          <!-- ☿ Mercury/Hermes — top of trunk (mind) -->
          <text x="200" y="70" text-anchor="middle" font-size="13" fill="#f5e090" opacity=".8"
            style="animation:pulse 4s ease-in-out infinite">☿</text>
          <!-- ☉ Sun — center of tree (soul) -->
          <text x="200" y="195" text-anchor="middle" font-size="11" fill="#f0d080" opacity=".7"
            style="animation:pulse 5s ease-in-out infinite 1s">☉</text>
          <!-- ☽ Moon — left mid branch -->
          <text x="148" y="172" text-anchor="middle" font-size="10" fill="url(#sv)" opacity=".75"
            style="animation:shimmer 6s ease-in-out infinite">☽</text>
          <!-- ⊕ Earth — right mid branch -->
          <text x="252" y="172" text-anchor="middle" font-size="10" fill="url(#sv)" opacity=".75"
            style="animation:shimmer 6s ease-in-out infinite 2s">⊕</text>
          <!-- △ Fire triangle — upper left -->
          <text x="162" y="122" text-anchor="middle" font-size="9" fill="#f0d080" opacity=".65">△</text>
          <!-- ▽ Water triangle — upper right -->
          <text x="238" y="122" text-anchor="middle" font-size="9" fill="url(#sv)" opacity=".65">▽</text>
          <!-- ✦ Star of Hermes — on main left root -->
          <text x="130" y="205" text-anchor="middle" font-size="8" fill="url(#gd)" opacity=".6">✦</text>
          <text x="270" y="205" text-anchor="middle" font-size="8" fill="url(#gd)" opacity=".6">✦</text>

          <!-- ROOTS -->
          <g opacity=".8">
            <path d="M200 268 Q175 285 155 296" stroke="url(#gd)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            <path d="M200 268 Q225 285 245 296" stroke="url(#gd)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            <path d="M198 278 Q168 298 144 312" stroke="url(#sv)" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".7"/>
            <path d="M202 278 Q232 298 256 312" stroke="url(#sv)" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".7"/>
            <path d="M196 288 Q160 312 136 326" stroke="url(#gd)" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".5"/>
            <path d="M204 288 Q240 312 264 326" stroke="url(#gd)" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".5"/>
            <!-- Tiny root sub-branches -->
            <path d="M155 296 Q140 308 130 316" stroke="url(#sv)" stroke-width=".7" fill="none" opacity=".5"/>
            <path d="M245 296 Q260 308 270 316" stroke="url(#sv)" stroke-width=".7" fill="none" opacity=".5"/>
          </g>

          <!-- Central luminous orb at root/trunk junction -->
          <circle cx="200" cy="268" r="7" fill="url(#gd)" opacity=".9" filter="url(#glow2)"
            style="animation:pulse 3.5s ease-in-out infinite"/>
          <circle cx="200" cy="268" r="13" fill="none" stroke="url(#gd)" stroke-width=".8" opacity=".3"
            style="animation:pulse 3.5s ease-in-out infinite 1s"/>

          <!-- Hermetic maxim — "As Above, So Below" indicator -->
          <!-- Upward triangle -->
          <polygon points="200,345 192,358 208,358" fill="none" stroke="url(#gd)" stroke-width=".8" opacity=".4"/>
          <!-- Downward triangle -->
          <polygon points="200,365 192,352 208,352" fill="none" stroke="url(#sv)" stroke-width=".8" opacity=".4"/>

          <!-- Text -->
          <text x="200" y="382" text-anchor="middle" font-family="Cinzel, serif" font-size="15" font-weight="600" fill="url(#gd)" letter-spacing="2">DANIELE</text>
          <text x="200" y="396" text-anchor="middle" font-family="Cinzel, serif" font-size="10" fill="url(#gd)" letter-spacing="1.5" font-weight="400">DALLAVECCHIA</text>
        </svg>
  </div>

  <div class="legend">
    <span class="leg-item">☿ Hermes Trismegisto — Mente</span>
    <span class="leg-item">☉ Sol — Alma</span>
    <span class="leg-item">☽ Lua — Intuição</span>
    <span class="leg-item">⊕ Terra — Matéria</span>
    <span class="leg-item">△ Fogo — Transformação</span>
    <span class="leg-item">▽ Água — Cura</span>
    <span class="leg-item">〰 Caduceu — União das Polaridades</span>
  </div>

  <div class="gold-line"></div>
  <p style="font-size:11px;color:rgba(200,180,240,.3);letter-spacing:1.5px;text-align:center">
    © Daniele Dallavecchia · Identidade Visual
  </p>
</div>
</body>
</html>
